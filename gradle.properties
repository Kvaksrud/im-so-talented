# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.19.5
# Loom pinned to a release, so a clean build gets the same Loom as the last one
loom_version=1.18.4

# Java the game runs on; CI sets up this version
java_version=25

# Mod Properties
# Bump mod_version to publish a new release: CI tags v<mod_version>+mc<minecraft_version> when main is pushed
# and CHANGELOG.md has a section for it that isn't marked (unreleased).
mod_version=0.2.0
archives_base_name=imsotalented-fabric
group=no.kvaksrud

# Dependencies
fabric_api_version=0.162.0+26.3
junit_version=6.1.3
